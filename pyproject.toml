[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quanllm-harness"
version = "0.1.0"
description = "Agentic verification harness for QuanLLM-v2.0-qm"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "quantum-mechanics", "verification", "agents", "sympy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mpmath>=1.3,<2",
  "openai>=1.60,<4",
  "openfermion>=1.7,<2",
  "pycommute>=1.0,<2",
  "qutip>=5.2.3,<5.3; python_version < '3.11'",
  "qutip>=5.2.3,<6; python_version >= '3.11'",
  "sympy>=1.12,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/lct-unv/quanllm-harness"
Repository = "https://github.com/lct-unv/quanllm-harness"
Issues = "https://github.com/lct-unv/quanllm-harness/issues"
Changelog = "https://github.com/lct-unv/quanllm-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27,<1",
  "ruff>=0.9",
  "twine>=5.1",
]

[project.scripts]
quanllm-harness = "quanllm_harness.cli:main"
quanllm-server = "quanllm_harness.interfaces.rest_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quanllm_harness"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/ARCHITECTURE.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/release-notes",
  "/scripts",
  "/ENV.example",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["quanllm_harness"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T201"]

[tool.mypy]
python_version = "3.10"
packages = ["quanllm_harness"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
